
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apple Fortune</title>
<style>
body {
  background: #101827;
  color: white;
  font-family: Arial;
  text-align: center;
  padding: 20px;
}
.container {
  max-width: 400px;
  margin: auto;
  background: #1e293b;
  padding: 20px;
  border-radius: 15px;
}
h1 { color: #facc15; }
input, button {
  width: 90%;
  padding: 13px;
  margin: 10px;
  border-radius: 8px;
  border: none;
  font-size: 16px;
}
button {
  background: #16a34a;
  color: white;
  font-weight: bold;
}
.result {
  font-size: 20px;
  color: #facc15;
  margin-top: 20px;
}
</style>
</head>
<body>
<div class="container">
<h1>🍎 APPLE FORTUNE</h1>
<p>Assistant d'analyse du jeu</p>
<input id="resultat" type="text"
placeholder="Entrez votre dernier résultat">
<button onclick="analyser()">ANALYSER</button>
<div class="result" id="sortie">
Votre analyse apparaîtra ici.
</div>
</div>
<script>
function analyser() {
  let valeur = document.getElementById("resultat").value;
  if (!valeur.trim()) {
    document.getElementById("sortie").innerText =
    "Veuillez entrer un résultat.";
    return;
  }
  document.getElementById("sortie").innerText =
  "Résultat enregistré : " + valeur +
  ". Aucun prochain résultat ne peut être garanti.";
}
</script>
</body>
</html>
